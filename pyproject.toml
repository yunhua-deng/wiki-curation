[project]
name = "wiki-curation"
version = "0.1.0"
description = "Knowledge lifecycle skill: produce, consume, update, and aggregate structured articles."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
wiki-curation = "scripts.cli:main"

[tool.pytest.ini_options]
testpaths = ["scripts"]
pythonpath = ["."]
norecursedirs = ["adhoc", "legacy", "wiki_index", "__pycache__"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["scripts"]
packages = ["scripts", "scripts.exec", "scripts.intake", "scripts.publish", "scripts.records", "scripts.store", "scripts.wiki_index"]

[tool.setuptools.package-data]
"*" = ["references/*", "assets/*"]
