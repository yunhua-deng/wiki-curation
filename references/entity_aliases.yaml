# entity_aliases.yaml — 实体同义词与术语归一化字典
#
# 用于 wiki 站点构建时的实体抽取与关联：
# - 把同一实体的多种写法归一到一个 canonical 名称
# - 把同一术语的中英文/简写归一，便于跨标签关联
#
# 维护方式：随 wiki 规模扩大逐步追加。agent 发现新的常见变体时应更新本文件。

# --- 术语/概念同义词 ---
# key: canonical 中文术语
# value: 需要被归一到该术语的别名列表（含英文、简写、大小写变体）
terms:
  具身智能:
    - embodied intelligence
    - embodied AI
    - Embodied AI
    - Embodied Intelligence
    - 具身人工智能
    - embodied-ai
  世界模型:
    - world model
    - world models
    - World Model
    - World Models
  视觉基础模型:
    - visual foundation model
    - visual foundation models
    - VFM
  视觉语言动作模型:
    - vision-language-action
    - vision language action
    - VLA
    - vla
  深度估计:
    - depth estimation
    - monocular depth estimation
  机器人操作:
    - robot manipulation
    - robotic manipulation
  扩散模型:
    - diffusion model
    - diffusion models
  强化学习:
    - reinforcement learning
    - RL
  模仿学习:
    - imitation learning
    - IL

