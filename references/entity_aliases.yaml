# 正则（re.IGNORECASE，search 语义）：命中即剔除
suppress_patterns:
  # 范围/层级代号：C0-C1, L1-L5, M1-M2, S1-S4, Q2-Q3, V1-V3, R1-R6, L2-1, T2-3D, A2-D, ID2-3 等
  - '^[A-Za-z]{0,2}\d+([-–—/][A-Za-z]{0,3}\d+)+$'
  # 硬件/配置串：A100/H100、H100-80G、RTX 4090、D415/D435、SO100 等
  - '^(A100|H100|H200|B200|H20|L20|L40|V100|A800|H800|RTX|4090|Jetson|RK3588|DDR5|FPC64|OS0|FP16|FP32|INT4|D415|D435|UR\d+e?|Dex3|Kinova|Go1|Go2|G1|H1)(\W.*)?$'
  # 含 markdown/表格碎片字符
  - '[|*#`\[\]\\✅⭐✗★❌⚠]'
  # URL 误抽
  - 'https?://'
  # 日期误抽：2026-03-30
  - '^\d{4}-\d{2}-\d{2}$'
