# sources.yaml — Wiki 工作流来源类型单一真相源
# 整合：分类规则（含别名）、抓取策略（handler / 渲染必需判定 / 有效性阈值）。
# 已废除且不再被任何代码读取的字段：checklist（素材检查清单）、fetch.drill（下钻白名单）。

aliases:
  paper: arxiv_paper
  arxiv: arxiv_paper
  weixin_paper: weixin
  github_project: github
  company: startup_name
  general: tech_blog
  blog: tech_blog
  project: project_name
  product: product_name
  news: news_article
  webpage: generic_web
  local: local_file
  local-file: local_file
  localfile: local_file
  multi-source: multi_source
  multisource: multi_source

settings:
  max_drill_depth: 3
  max_children_per_level: 5
  max_l3_children_per_parent: 2
  fetch_timeout: 60
  # handler_webpage 材料有效性下限：剥离 script/style/标签后的可见正文字符数。
  # SPA 外壳（Vite/React/Next CSR）正文由 JS 渲染，curl 只能拿到 2KB 级空壳，
  # 低于该阈值判 failed 并标记 spa_shell（见 wiki/docs/issues/2026-09-14_001）。
  min_visible_chars: 800
  # 渲染必需来源的轻量路径重试次数（不含首次）：第一次失败后再重试几次 curl /
  # opencli weixin，仍失败才回退浏览器渲染。微信 opencli 偶发 0 字节，
  # 同一 URL 第二次即可恢复（见 wiki/docs/issues/2026-07-29_008）。
  render_retries: 2

# 渲染必需来源判定（见 wiki/docs/issues/2026-09-15_004）：
# 这些来源的正文无法靠「无 JS、无登录态」的简单 HTTP 抓取稳定获得，collect_materials
# 会先尝试既有轻量路径（curl / opencli weixin），失败则回退浏览器渲染
# （产物 raw/<file_stem>_rendered.html + raw/<file_stem>_rendered.md）。
# 命中任一维度即判定成立；配置缺失或损坏一律按「非渲染必需」处理，不阻断普通来源。
render_required:
  # 来源类型（canonical subtype，别名会先解析）
  subtypes: [weixin, linkedin, zhihu, reddit, twitter_x]
  # 域名（命中 host 本身或其子域）
  domains: [mp.weixin.qq.com, linkedin.com, zhihu.com, reddit.com, twitter.com, x.com, threads.net]
  # URL 片段：HF Space 容器地址 <name>.hf.space 与 huggingface.co/spaces/ 外壳页
  path_patterns: ["huggingface.co/spaces/", "hf.space/"]
  # URL 标记：hashbang 路由（SPA，正文由 JS 注入）
  url_markers: ["#!"]

source_types:
  # ============================================================
  # 学术 / 论文
  # ============================================================
  arxiv_paper:
    label_cn: "arXiv论文"
    classification:
      input_type: url
      domains: [arxiv.org]
      path_patterns: ["/abs/", "/pdf/", "/html/"]
      extract_patterns:
        arxiv_id: 'arxiv\.org/(?:abs|pdf|html)/(\d{4}\.\d{4,5})(?:v\d+)?'
    fetch:
      handler: arxiv

  arxiv_id:
    label_cn: "arXiv论文ID"
    classification:
      input_type: keywords
      patterns: ['\b(\d{4}\.\d{4,5})(?:v\d+)?\b']
    fetch:
      handler: arxiv

  arxiv_title:
    label_cn: "arXiv论文标题"
    classification:
      input_type: keywords
      keywords: ['arxiv', '论文']
    fetch:
      handler: search_then_arxiv

  paper_keyword:
    label_cn: "论文搜索"
    classification:
      input_type: keywords
      keywords: ['论文', 'paper', '文献', '搜索', '查找', '推荐']
    fetch:
      handler: search

  # ============================================================
  # 本地文件（用户手动提供）
  # ============================================================
  local_file:
    label_cn: "本地文件"
    classification:
      input_type: local
    fetch:
      handler: none

  multi_source:
    label_cn: "多源聚合"
    classification:
      input_type: keywords
    fetch:
      handler: none

  # ============================================================
  # 代码 / 开源
  # ============================================================
  github:
    label_cn: "GitHub项目"
    classification:
      input_type: url
      domains: [github.com]
    fetch:
      handler: github

  huggingface:
    label_cn: "HuggingFace"
    classification:
      input_type: url
      domains: [huggingface.co, modelscope.cn]
    fetch:
      handler: webpage
      file_stem: "hf_model_card"

  project_name:
    label_cn: "开源项目"
    classification:
      input_type: keywords
      keywords: ['开源项目', 'GitHub项目', 'repo', '项目']
    fetch:
      handler: search_then_github

  # ============================================================
  # 社交媒体 / 内容平台
  # ============================================================
  weixin:
    label_cn: "微信公众号"
    classification:
      input_type: url
      domains: [mp.weixin.qq.com]
    fetch:
      handler: weixin

  linkedin:
    label_cn: "LinkedIn帖子"
    classification:
      input_type: url
      domains: [linkedin.com]
    fetch:
      handler: linkedin

  zhihu:
    label_cn: "知乎"
    classification:
      input_type: url
      domains: [zhihu.com]
    fetch:
      handler: webpage
      file_stem: "zhihu_article"

  reddit:
    label_cn: "Reddit"
    classification:
      input_type: url
      domains: [reddit.com]
    fetch:
      handler: webpage
      file_stem: "reddit_post"

  twitter_x:
    label_cn: "Twitter/X"
    classification:
      input_type: url
      domains: [twitter.com, x.com, threads.net]
    fetch:
      handler: webpage
      file_stem: "twitter_post"

  youtube:
    label_cn: "YouTube"
    classification:
      input_type: url
      domains: [youtube.com, youtu.be, vimeo.com]
    fetch:
      handler: webpage
      file_stem: "youtube_transcript"

  bilibili:
    label_cn: "B站"
    classification:
      input_type: url
      domains: [bilibili.com]
    fetch:
      handler: webpage
      file_stem: "bilibili_transcript"

  podcast:
    label_cn: "播客"
    classification:
      input_type: url
      domains: []
      fuzzy_domains: ['podcast']
    fetch:
      handler: webpage
      file_stem: "podcast_transcript"

  # ============================================================
  # 网页 / 博客 / 文档 / 新闻
  # ============================================================
  tech_blog:
    label_cn: "技术博客"
    classification:
      input_type: url
      domains: [medium.com, substack.com, dev.to, hackernews.com, news.ycombinator.com]
      fuzzy_domains: ['blog', 'jiqizhixin.com', 'sspai.com']
    fetch:
      handler: webpage
      file_stem: "tech_blog"

  project_page:
    label_cn: "项目主页"
    classification:
      input_type: url
      fuzzy_domains: ['github.io', 'notion.site', 'notion.so', 'vercel.app', 'netlify.app', 'pages.dev', 'research.']
    fetch:
      handler: webpage
      file_stem: "project_page"

  company_site:
    label_cn: "公司官网"
    classification:
      input_type: url
      domains: [chatgpt.com, deepseek.com, platform.deepseek.com, claude.ai, kimi.moonshot.cn, gemini.google.com, chat.openai.com, autodl.com]
      fuzzy_domains: ['company']
    fetch:
      handler: webpage
      file_stem: "company_site"

  docs:
    label_cn: "技术文档"
    classification:
      input_type: url
      fuzzy_domains: ['readthedocs.io', '^docs\.']
    fetch:
      handler: webpage
      file_stem: "docs_page"

  news_article:
    label_cn: "新闻报道"
    classification:
      input_type: url
      fuzzy_domains: ['news.', '36kr.com']
    fetch:
      handler: webpage
      file_stem: "news_article"

  # ============================================================
  # 实体 / 问题 / 对比 / 趋势
  # ============================================================
  startup_name:
    label_cn: "公司分析"
    classification:
      input_type: keywords
      keywords: ['公司', '企业', 'startup', '初创', '厂商']
      named_entities: ['OpenAI', 'Google DeepMind', 'Anthropic', 'Meta AI', 'Stability AI', 'Mistral', 'Cohere', 'Figure AI', 'Physical Intelligence', 'Skild AI', 'Covariant', 'Sanctuary', 'Agility', 'Apptronik', 'Teslabot', 'Boston Dynamics', 'NVIDIA', 'ByteDance']
    fetch:
      handler: search

  product_name:
    label_cn: "产品分析"
    classification:
      input_type: keywords
      keywords: ['产品', '应用', 'app', 'tool']
    fetch:
      handler: search

  researcher:
    label_cn: "学者解读"
    classification:
      input_type: keywords
      keywords: ['教授', '学者', '研究者', 'researcher', 'scholar', 'scientist']
      named_entities: ['Yann LeCun', 'Geoffrey Hinton', 'Yoshua Bengio', 'Andrew Ng', 'Fei-Fei Li', 'Andrej Karpathy', 'Ilya Sutskever', 'Jim Fan', 'Pieter Abbeel', 'Sergey Levine', 'Chelsea Finn', 'Ken Goldberg']
    fetch:
      handler: search

  concept_query:
    label_cn: "概念查询"
    classification:
      input_type: keywords
      keywords: ['什么是', '是什么', '解释', '定义', '概念']
      abbreviations: ['RLHF', 'RL', 'MDP', 'Transformer', 'Attention', 'Diffusion', 'VLA', 'LLM', 'MCP', 'RAG', 'RLVR', 'GRPO', 'PPO', 'SFT', 'LoRA', 'MoE', 'MLA']
    fetch:
      handler: search

  comparison:
    label_cn: "对比分析"
    classification:
      input_type: keywords
      keywords: ['对比', '比较', 'vs', 'versus', '哪个', 'A/B']
    fetch:
      handler: search

  trend_question:
    label_cn: "趋势分析"
    classification:
      input_type: keywords
      keywords: ['趋势', '发展前景', '展望', '未来方向', '前沿趋势', '综述', 'survey', 'roadmap', '技术路线']
    fetch:
      handler: search

  generic_web:
    label_cn: "网页"
    classification:
      input_type: url
      fallback: true
    fetch:
      handler: webpage
      file_stem: "webpage"
